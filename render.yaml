# FlickerSecure - Full Production Deployment for Render
# Database + Backend API + Frontend Web

databases:
  - name: flicker-postgres
    databaseName: flickersecure_db
    user: flickeruser
    plan: free

services:
  # Backend API - Node.js with PostgreSQL
  - type: web
    name: flicker-secure-api
    runtime: node
    plan: free
    buildCommand: cd backend-api && npm install && npm run build
    startCommand: cd backend-api && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: flicker-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_URL
        value: https://flicker-secure-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SOLANA_NETWORK
        value: devnet
      - key: CORS_ORIGINS
        value: https://flicker-secure-web.onrender.com,exp://,http://localhost:19006,http://localhost:3000

  # Frontend Web - Static Site
  - type: web
    name: flicker-secure-web
    runtime: static
    buildCommand: cd frontend-web && npm install && npm run build
    staticPublishPath: frontend-web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://flicker-secure-api.onrender.com
      - key: VITE_WS_URL
        value: wss://flicker-secure-api.onrender.com
