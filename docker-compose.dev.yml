version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: flickersecure_postgres
    environment:
      POSTGRES_DB: flickersecure_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flickersecure_network

  redis:
    image: redis:7-alpine
    container_name: flickersecure_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword123
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flickersecure_network

volumes:
  postgres_data:
  redis_data:

networks:
  flickersecure_network:
    driver: bridge
